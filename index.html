<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var userSet = localStorage.getItem('fc-theme-user-set') === '1';
          var saved = localStorage.getItem('fc-theme');
          var theme = (userSet && saved && saved !== 'system') ? saved : 'system';
          var target = theme;
          if (theme === 'system') {
            target = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', target);
          if (target === 'stealth') {
            root.classList.add('dark', 'stealth');
          } else if (target === 'dark') {
            root.classList.add('dark');
            root.classList.remove('stealth');
          } else {
            root.classList.remove('dark', 'stealth');
          }
        } catch (e) {}
      })();
    </script>
